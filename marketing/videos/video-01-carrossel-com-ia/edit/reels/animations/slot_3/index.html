<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Legendas (Reels) — Y OS</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="captions.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 700;
        src: url("fonts/Inter-700.woff2") format("woff2");
      }

      body {
        margin: 0;
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Inter bold #F2F0F5, no box (Júlia's call): a soft shadow does the
         separating over the white Canva screen and the light wall. */
      .cap {
        position: absolute;
        left: 540px;
        /* max-content: with left at the centre line the box would otherwise
           shrink to the 540px left of it and wrap short phrases. */
        width: max-content;
        max-width: 820px;
        box-sizing: border-box;
        /* A lighter shadow disappeared over the Canva/wall at 17-20s; this is
           the least that still reads there. */
        text-shadow:
          0 0 3px rgba(8, 6, 14, 0.55),
          0 2px 3px rgba(8, 6, 14, 0.6),
          0 0 12px rgba(8, 6, 14, 0.5),
          0 0 28px rgba(8, 6, 14, 0.35);
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 54px;
        line-height: 1.16;
        letter-spacing: -0.01em;
        color: #f2f0f5;
        text-align: center;
        text-wrap: balance;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Seam between screen and camera, above her head (bun starts ~1080). */
      .cap.seam {
        top: 965px;
      }

      /* In the closing segment the camera sits higher, so the line drops to
         her collar, clear of the Reels caption area below ~1570. */
      .cap.chest {
        top: 1500px;
      }

      /* Words still to come are dimmed through the colour, not opacity, so
         their shadow stays at full strength over light backgrounds. */
      .w {
        color: rgba(242, 240, 245, 0.62);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="legendas-reels"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="40.2333"
    >
      <section id="caps-clip" class="clip" data-start="0" data-duration="40.2333"></section>
    </div>

    <script>
      const clip = document.getElementById("caps-clip");
      const tl = gsap.timeline({ paused: true });

      window.CAPTIONS.forEach((c, ci) => {
        const el = document.createElement("div");
        el.className = "cap " + c.pos;
        c.words.forEach((w, wi) => {
          const span = document.createElement("span");
          span.className = "w";
          span.textContent = w.t;
          el.appendChild(span);
          if (wi < c.words.length - 1) el.appendChild(document.createTextNode(" "));
          w.el = span;
        });
        clip.appendChild(el);
        gsap.set(el, { xPercent: -50, yPercent: -50 });

        // Chunk pops in on its first word and cuts out when the next arrives.
        if (ci === 0) {
          // First frame of the Reels already carries the hook line.
          tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.01 }, 0);
        } else {
          tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out" }, c.start);
        }
        tl.set(el, { opacity: 0 }, c.end);

        // Each word lights up as it is spoken. Lime only on the promise and
        // the turn (Claude, 10 minutos, imagens prontas, carrossel).
        c.words.forEach((w) => {
          const at = Math.max(w.s, c.start);
          tl.fromTo(
            w.el,
            { color: "rgba(242, 240, 245, 0.62)" },
            { color: w.lime ? "rgba(198, 241, 53, 1)" : "rgba(242, 240, 245, 1)", duration: 0.08, ease: "none" },
            at
          );
        });
      });

      window.__timelines["legendas-reels"] = tl;
    </script>
  </body>
</html>
