<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fagulha Claude — Y OS</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: transparent;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lime halo in the clear wall area, same anchor the deck used — the beat
         lands where the eye already learned to look. */
      #halo {
        position: absolute;
        left: 365px;
        top: 50%;
        width: 900px;
        height: 900px;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(198, 241, 53, 0.3) 0%,
          rgba(198, 241, 53, 0.12) 38%,
          rgba(198, 241, 53, 0) 68%
        );
        will-change: transform, opacity;
      }

      /* The mark alone, no card around it. Sized to read from across a room
         without crowding her side of the frame. */
      #mark {
        position: absolute;
        left: 365px;
        top: 50%;
        width: 260px;
        height: 260px;
        z-index: 2;
        display: block;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="fagulha"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.5"
    >
      <section id="fagulha-clip" class="clip" data-start="0" data-duration="4.5">
        <div id="halo"></div>
        <img id="mark" src="claude-mark.png" alt="" />
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // The light comes up first so the mark turns *into* a lit space.
      tl.fromTo(
        "#halo",
        { xPercent: -50, yPercent: -50, scale: 0.7, opacity: 0 },
        { xPercent: -50, yPercent: -50, scale: 1, opacity: 1, duration: 0.9, ease: "power2.out" },
        0
      );

      // Entrance: arrives turning, settling into its resting angle.
      tl.fromTo(
        "#mark",
        {
          xPercent: -50,
          yPercent: -50,
          scale: 0.72,
          rotation: -26,
          opacity: 0,
          transformOrigin: "50% 50%",
        },
        {
          xPercent: -50,
          yPercent: -50,
          scale: 1,
          rotation: 0,
          opacity: 1,
          duration: 1.0,
          ease: "power3.out",
        },
        0.22
      );

      // Then it keeps turning slowly for the rest of the beat — alive, but not
      // asking to be watched. Finite rotation, never `repeat: -1`.
      tl.to(
        "#mark",
        {
          rotation: 14,
          duration: 3.0,
          ease: "none",
          transformOrigin: "50% 50%",
        },
        1.22
      );

      tl.to("#mark", { opacity: 0, scale: 0.94, duration: 0.42, ease: "power2.in" }, 4.05);
      tl.to("#halo", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.05);

      window.__timelines["fagulha"] = tl;
    </script>
  </body>
</html>
